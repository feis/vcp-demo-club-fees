<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>晚風羽球社・本週費用</title>
  <style>
    :root { font-synthesis: none; }
    body { font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; margin: 0; padding: 24px 16px; background: #f6f4ef; color: #222; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 26px; font-weight: normal; font-family: "PingFang TC Semibold", "Noto Sans TC SemiBold", "Microsoft JhengHei", sans-serif; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
    label { display: block; font-size: 16px; }
    input { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px; font-size: 18px; border: 1px solid #aaa; border-radius: 6px; }
    .error { color: #b3261e; font-size: 14px; min-height: 20px; margin-top: 4px; }
    button { margin-top: 20px; padding: 12px 32px; font-size: 18px; border: 0; border-radius: 6px; background: #2f5d50; color: #fff; }
    #result { margin-top: 20px; font-size: 22px; white-space: pre-line; }
    .note { color: #666; font-size: 14px; margin-top: 24px; }
  </style>
</head>
<body>
<main>
  <h1>晚風羽球社・本週費用</h1>
  <div class="grid">
    <div><label>本週場地費（元）<input id="court" inputmode="numeric"></label><div class="error" id="court-error"></div></div>
    <div><label>出席人數<input id="people" inputmode="numeric"></label><div class="error" id="people-error"></div></div>
    <div><label>其中新人幾位<input id="newbies" inputmode="numeric"></label><div class="error" id="newbies-error"></div></div>
    <div><label>用掉幾顆球<input id="balls" inputmode="numeric"></label><div class="error" id="balls-error"></div></div>
  </div>
  <button id="calc">計算</button>
  <p id="result"></p>
  <p class="note">規則：場地費只由老社員平分（新人第一個月免場地費）；球一顆 50 元，所有出席的人平分。</p>
</main>
<script>
  const BALL_PRICE = 50;
  const fields = ['court', 'people', 'newbies', 'balls'];
  const $ = (id) => document.getElementById(id);

  function readNumber(id) {
    const raw = $(id).value.trim();
    if (raw === '') return { error: '這一格還沒填' };
    if (!/^\d+$/.test(raw)) return { error: '請填阿拉伯數字，例如 10' };
    return { value: Number(raw) };
  }

  $('calc').onclick = () => {
    const values = {};
    let ok = true;
    for (const id of fields) {
      const r = readNumber(id);
      $(id + '-error').textContent = r.error || '';
      if (r.error) ok = false; else values[id] = r.value;
    }
    if (ok && values.people === 0) { $('people-error').textContent = '出席人數至少 1 人'; ok = false; }
    if (ok && values.newbies > values.people) { $('newbies-error').textContent = '新人不能比出席人數多'; ok = false; }
    if (ok && values.newbies === values.people && values.court > 0) { $('newbies-error').textContent = '全部都是新人，場地費沒有人分'; ok = false; }
    if (!ok) { $('result').textContent = ''; return; }

    const regulars = values.people - values.newbies;
    const courtEach = regulars > 0 ? values.court / regulars : 0;
    const ballEach = values.balls * BALL_PRICE / values.people;
    const round = (n) => Math.round(n);
    $('result').textContent =
      `老社員每人 ${round(courtEach + ballEach)} 元\n新人每人 ${round(ballEach)} 元`;
  };
</script>
</body>
</html>
